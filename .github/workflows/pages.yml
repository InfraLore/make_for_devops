name: Pages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: danteev/texlive:latest
    steps:
      - uses: actions/checkout@v6

      - name: Build HTML
        run: make html

      - name: Assemble Pages artifact
        run: |
          mkdir -p _site
          cp pages/index.html _site/index.html
          cp build/html/MakeForDevops.html _site/MakeForDevops.html
          cp -r images _site/images

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
