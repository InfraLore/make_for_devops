<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Make for DevOps</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1a1a1a;
      background: #fafafa;
      line-height: 1.6;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
      text-align: center;
    }
    .cover {
      width: 240px;
      border-radius: 4px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.12);
      margin-bottom: 2rem;
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }
    .author {
      color: #555;
      font-size: 1rem;
      margin-bottom: 0.25rem;
    }
    .creators {
      color: #777;
      font-size: 0.8rem;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-block;
      padding: 0.75rem 2rem;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: background 0.2s;
    }
    .btn-primary {
      background: #1a1a1a;
      color: #fff;
    }
    .btn-primary:hover { background: #333; }
    .downloads {
      margin-top: 2.5rem;
      padding-top: 2rem;
      border-top: 1px solid #e0e0e0;
    }
    .downloads h2 {
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #888;
      margin-bottom: 1rem;
    }
    .download-links {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .download-links a {
      display: inline-block;
      padding: 0.5rem 1.25rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      text-decoration: none;
      color: #333;
      font-size: 0.875rem;
      font-weight: 500;
      transition: border-color 0.2s, background 0.2s;
    }
    .download-links a:hover {
      border-color: #1a1a1a;
      background: #f0f0f0;
    }
    .license {
      margin-top: 3rem;
      font-size: 0.75rem;
      color: #999;
    }
    .license a { color: #777; }
  </style>
</head>
<body>
  <div class="container">
    <img src="images/cover.png" alt="Make for DevOps cover" class="cover" />
    <h1>Make for DevOps</h1>
    <p class="author">by Claude Sonnet v4.5</p>
    <p class="creators">
      Production Editor: Hardy J. Pottinger, IV &middot;
      Technical Editor: John H. Robinson, IV
    </p>
    <a href="MakeForDevops.html" class="btn btn-primary">Read the Book</a>
    <div class="downloads">
      <h2>Download</h2>
      <div class="download-links">
        <a id="pdf-link" href="https://github.com/InfraLore/make_for_devops/releases/latest">PDF</a>
        <a id="epub-link" href="https://github.com/InfraLore/make_for_devops/releases/latest">EPUB</a>
      </div>
    </div>
    <p class="license">
      <a href="https://creativecommons.org/publicdomain/zero/1.0/">CC0 1.0 Universal (public domain dedication).</a>
    </p>
  </div>
  <script>
    fetch("https://api.github.com/repos/InfraLore/make_for_devops/releases/latest")
      .then(function(r) { return r.json(); })
      .then(function(release) {
        if (!release.assets) return;
        release.assets.forEach(function(asset) {
          if (asset.name.endsWith(".pdf"))
            document.getElementById("pdf-link").href = asset.browser_download_url;
          if (asset.name.endsWith(".epub"))
            document.getElementById("epub-link").href = asset.browser_download_url;
        });
      })
      .catch(function() {});
  </script>
</body>
</html>
